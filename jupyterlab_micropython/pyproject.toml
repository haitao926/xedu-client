[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab-micropython"
version = "2.1.0"
description = "ESP32 MicroPython experiment workflow for XEdu Client"
requires-python = ">=3.8"

[tool.hatch.build.targets.wheel]
packages = ["jupyterlab_micropython"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyterlab_micropython/labextension" = "share/jupyter/labextensions/jupyterlab-micropython"
