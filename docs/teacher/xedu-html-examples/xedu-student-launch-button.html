<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>打开 XEdu</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f5f7fb;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(28rem, calc(100% - 2rem));
        padding: 2rem;
        text-align: center;
        background: #fff;
        border: 1px solid #dfe5ef;
        border-radius: 8px;
        box-shadow: 0 12px 32px rgb(23 32 51 / 10%);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }

      p {
        margin: 0 0 1.5rem;
        color: #5d687a;
        line-height: 1.6;
      }

      button {
        width: 100%;
        min-height: 2.75rem;
        padding: 0.7rem 1rem;
        color: #fff;
        font: inherit;
        font-weight: 700;
        background: #2563eb;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #status {
        min-height: 1.5rem;
        margin: 1rem 0 0;
        font-size: 0.9rem;
      }

      #status[data-state="error"] {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <!--
      OpenLearnSite may replace these values while rendering the course page.
      They are routing metadata, not student identity or a grant.
    -->
    <main
      id="xedu-launch"
      data-launch-endpoint="/api/xedu/v1/launch"
      data-course-id=""
      data-activity-id=""
      data-resource-id="lesson1/exp1/index.html"
    >
      <h1>准备开始实验</h1>
      <p>点击下方按钮打开 XEdu，在 XEdu 中完成并提交测试。</p>
      <button id="open-xedu" type="button">打开 XEdu</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
      (() => {
        const container = document.querySelector('#xedu-launch');
        const button = document.querySelector('#open-xedu');
        const status = document.querySelector('#status');

        function showStatus(message, state) {
          status.textContent = message;
          status.dataset.state = state || '';
        }

        function readConfig() {
          const { dataset } = container;
          return {
            endpoint: dataset.launchEndpoint,
            courseId: dataset.courseId,
            activityId: dataset.activityId,
            resourceId: dataset.resourceId,
          };
        }

        async function requestLaunch() {
          const config = readConfig();
          if (!config.endpoint || !config.resourceId) {
            throw new Error('平台没有配置 XEdu 任务资源。');
          }

          const response = await fetch(config.endpoint, {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              course_id: config.courseId || undefined,
              activity_id: config.activityId || undefined,
              resource_id: config.resourceId,
            }),
          });

          let payload = null;
          try {
            payload = await response.json();
          } catch {
            throw new Error(`平台接口返回了无效响应（HTTP ${response.status}）。`);
          }

          if (!response.ok || !payload.ok || !payload.launch_url) {
            throw new Error(payload.message || '平台尚未配置 XEdu 启动接口。');
          }

          return payload.launch_url;
        }

        button.addEventListener('click', async () => {
          button.disabled = true;
          showStatus('正在连接 XEdu…');

          try {
            const launchUrl = await requestLaunch();
            showStatus('正在打开 XEdu…');
            window.location.assign(launchUrl);
          } catch (error) {
            button.disabled = false;
            showStatus(error instanceof Error ? error.message : '无法打开 XEdu。', 'error');
          }
        });
      })();
    </script>
  </body>
</html>
