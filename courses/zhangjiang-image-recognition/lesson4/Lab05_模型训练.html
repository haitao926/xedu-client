<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型训练实验室 | Training Lab</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --accent-loss: #ef4444;
            --accent-acc: #10b981;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--text-main);
            font-weight: 800;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 320px 1fr 350px;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }

        .panel {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .panel-header {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            background: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-content { padding: 20px; overflow-y: auto; flex: 1; }

        /* Controls */
        .control-group { margin-bottom: 20px; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.85rem; font-weight: 500; }
        
        select, input[type="range"] {
            width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border);
        }

        .btn {
            width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer;
            background: var(--primary); color: white; transition: all 0.2s;
            display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        .btn-stop { background: #ef4444; display: none; }
        .btn-stop:hover { background: #dc2626; }
        .btn-export { background: #10b981; display: none; }
        .btn-export:hover { background: #059669; }

        /* Stats & Viz */
        .stats-row { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card {
            flex: 1; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center;
        }
        .stat-val { font-size: 1.4rem; font-weight: 700; margin-top: 5px; }

        .terminal {
            background: #1e293b; color: #e2e8f0; font-family: monospace; font-size: 0.8rem;
            padding: 10px; border-radius: 8px; height: 120px; overflow-y: auto;
            margin-top: 20px; border: 1px solid #334155;
        }

        .code-block {
            background: #1e293b; color: #d4d4d4; padding: 15px; border-radius: 8px;
            font-family: monospace; font-size: 0.8rem; overflow-x: auto; white-space: pre;
            height: 100%;
        }
        .kw { color: #c678dd; } .fn { color: #61afef; } .num { color: #d19a66; } .str { color: #98c379; } .cmt { color: #6b7280; }

    </style>
</head>
<body>

    <header>
        <div>
            <h1>Model Training Lab</h1>
            <div style="font-size:0.9rem; color:var(--text-sub);">训练 AI 大脑</div>
        </div>
        <div id="taskStatus" style="font-size:0.85rem; color:var(--text-sub); background: #fff; padding: 6px 12px; border-radius: 20px; border:1px solid var(--border);">
            当前数据: 默认演示数据 (2 类)
        </div>
    </header>

    <div class="main-grid">
        
        <!-- 1. Controls -->
        <aside class="panel">
            <div class="panel-header">🎛️ 训练配置</div>
            <div class="panel-content">
                
                <!-- Custom Network Input -->
                <div class="control-group" style="border-bottom:1px solid var(--border); padding-bottom:15px;">
                    <div class="label-row">
                        <span>🧠 定义网络结构 (Paste from Lab04)</span>
                    </div>
                    <textarea id="model-struct-input" style="width:100%; height:120px; font-family:monospace; font-size:0.75rem; padding:8px; border:1px solid var(--border); border-radius:6px; resize:vertical; background:#f8fafc; color:#334155;" spellcheck="false">
# 默认结构
model = models.Sequential([
    layers.Dense(32, activation='relu', input_shape=(784,)),
    layers.Dense(16, activation='relu'),
    layers.Dense(2, activation='softmax')
])</textarea>
                    <button class="btn" style="padding:6px; font-size:0.8rem; background:#fff; color:var(--primary); border:1px solid var(--primary);" onclick="parseAndApplyModel()">
                        ⚡ 应用网络结构
                    </button>
                </div>

                <!-- Hyperparameters -->
                <div class="control-group">
                    <div class="label-row">
                        <span>Epochs (轮数)</span>
                        <span id="epoch-val" style="background:#e0e7ff; color:var(--primary); padding:2px 6px; border-radius:4px;">20</span>
                    </div>
                    <input type="range" id="epoch-slider" min="5" max="100" value="20" step="5">
                </div>

                <div class="control-group">
                    <div class="label-row"><span>Batch Size & LR</span></div>
                    <div style="display:flex; gap:10px;">
                        <select id="batch-select" style="flex:1;">
                            <option value="4">Batch: 4</option>
                            <option value="16" selected>Batch: 16</option>
                            <option value="32">Batch: 32</option>
                        </select>
                        <select id="lr-select" style="flex:1;">
                            <option value="0.01">LR: 0.01</option>
                            <option value="0.001" selected>LR: 0.001</option>
                            <option value="0.0001">LR: 0.0001</option>
                        </select>
                    </div>
                </div>

                <!-- Import Data -->
                <div class="control-group" style="border-top:1px solid var(--border); padding-top:15px;">
                    <label class="btn" style="background:#fff; color:var(--text-main); border:1px solid var(--border); margin-top:0;">
                        📂 导入数据集 (JSON)
                        <input type="file" id="importDatasetInput" accept=".json" style="display:none;">
                    </label>
                </div>

                <div style="margin-top:auto;">
                    <button class="btn" id="btn-start" onclick="startTraining()">🚀 开始训练</button>
                    <button class="btn btn-stop" id="btn-stop" onclick="stopTraining()">⏹ 停止训练</button>
                    <button class="btn btn-export" id="btn-export" onclick="exportModel()">💾 导出模型</button>
                </div>

            </div>
        </aside>

        <!-- 2. Monitor -->
        <main class="panel">
            <div class="panel-header">📈 训练监控 (Real-time TF.js)</div>
            <div class="panel-content">
                <div class="stats-row">
                    <div class="stat-card">
                        <div style="font-size:0.8rem; color:#64748b">Loss</div>
                        <div class="stat-val" id="disp-loss" style="color:var(--accent-loss)">--</div>
                    </div>
                    <div class="stat-card">
                        <div style="font-size:0.8rem; color:#64748b">Accuracy</div>
                        <div class="stat-val" id="disp-acc" style="color:var(--accent-acc)">--</div>
                    </div>
                    <div class="stat-card">
                        <div style="font-size:0.8rem; color:#64748b">Epoch</div>
                        <div class="stat-val" id="disp-epoch">0/0</div>
                    </div>
                </div>

                <div style="position:relative; height:180px; width:100%;">
                    <canvas id="trainingChart"></canvas>
                </div>

                <!-- Network Viz -->
                <div style="margin-top:20px; height:160px; border:1px solid #e2e8f0; border-radius:8px; position:relative; overflow:hidden;">
                    <canvas id="netVizCanvas" style="width:100%; height:100%;"></canvas>
                    <div style="position:absolute; top:5px; left:10px; font-size:0.7rem; color:#94a3b8;">Network Architecture</div>
                </div>

                <div class="terminal" id="terminal">
                    <div>> 系统就绪，等待训练...</div>
                </div>
            </div>
        </main>

        <!-- 3. Code -->
        <aside class="panel">
            <div class="panel-header">🐍 完整训练代码预览</div>
            <div class="panel-content" style="padding:0;">
                <div class="code-block" id="code-preview"></div>
            </div>
        </aside>

    </div>

    <script>
        // === 1. 全局变量与初始化 ===
        let dataset = { labels: ["A", "B"], data: [] };
        let model = null;
        let customModelConfig = null;
        let isTraining = false;
        let stopRequested = false;
        let netAnimId;

        // Chart Init
        const ctx = document.getElementById('trainingChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Loss', borderColor: '#ef4444', data: [], tension: 0.2, yAxisID: 'y' },
                    { label: 'Accuracy', borderColor: '#10b981', data: [], tension: 0.2, yAxisID: 'y1' }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                scales: {
                    y: { position: 'left', min: 0 },
                    y1: { position: 'right', min: 0, max: 1, grid: {drawOnChartArea:false} }
                }
            }
        });

        // Network Canvas
        const netCanvas = document.getElementById('netVizCanvas');
        const netCtx = netCanvas.getContext('2d');

        // === 2. 数据管理 ===
        function loadLocalDataset() {
            const str = localStorage.getItem('zhangjiang_dataset');
            if(str) {
                try {
                    const ds = JSON.parse(str);
                    // Compatible with both formats
                    if(ds.labels && ds.labels.length >= 2) {
                        dataset = ds;
                        updateUI(`✅ 已加载本地数据: ${ds.labels.length} 类, ${ds.count || ds.data.length} 样本`);
                        return;
                    }
                } catch(e) { console.error(e); }
            }
            generateMockData();
        }

        function generateMockData() {
            dataset.data = [];
            dataset.labels = ["Class A", "Class B"];
            for(let i=0; i<50; i++) {
                dataset.data.push({ label: 0, data: new Array(784).fill(0).map((_,k)=>k<392?Math.random():0) });
                dataset.data.push({ label: 1, data: new Array(784).fill(0).map((_,k)=>k>=392?Math.random():0) });
            }
            updateUI("⚠️ 未检测到采集数据，使用自动生成演示数据");
        }

        document.getElementById('importDatasetInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const ds = JSON.parse(ev.target.result);
                    let validData = [];
                    let labels = [];
                    
                    if(Array.isArray(ds)) { // Array format
                        labels = [...new Set(ds.map(s=>s.label))].sort();
                        validData = ds;
                    } else if(ds.data) { // Object format
                        labels = ds.labels;
                        validData = ds.data;
                    }

                    if(labels.length < 2) throw new Error("类别过少");
                    
                    dataset = { labels: labels, data: validData };
                    localStorage.setItem('zhangjiang_dataset', JSON.stringify(dataset));
                    updateUI(`✅ 导入成功: ${labels.length} 类, ${validData.length} 样本`);
                } catch(err) { alert("数据格式错误: " + err.message); }
            };
            reader.readAsText(file);
        });

        function updateUI(msg) {
            document.getElementById('taskStatus').innerText = msg;
            // Re-render network in case output nodes changed
            drawNetFrame(false, customModelConfig);
            updateCode();
        }

        // === 3. 模型解析与构建 ===
        window.parseAndApplyModel = function() {
            const code = document.getElementById('model-struct-input').value;
            const layers = [];
            const regex = /Dense\(\s*(\d+)\s*(?:,\s*activation=['"](\w+)['"])?/g;
            let match;
            
            while ((match = regex.exec(code)) !== null) {
                layers.push({
                    units: parseInt(match[1]),
                    activation: match[2] || 'linear'
                });
            }

            if (layers.length < 1) {
                alert("未识别到有效的网络层结构！");
                return;
            }

            // Auto-correct last layer
            const lastLayer = layers[layers.length-1];
            if (lastLayer.units !== dataset.labels.length) {
                lastLayer.units = dataset.labels.length;
                lastLayer.activation = 'softmax';
                log(`自动修正输出层为 ${lastLayer.units} 个节点`, 'log-info');
            }

            customModelConfig = layers;
            drawNetFrame(false, layers);
            updateCode();
            
            const btn = document.querySelector('button[onclick="parseAndApplyModel()"]');
            const originalText = btn.innerText;
            btn.innerText = "✅ 已应用";
            setTimeout(() => btn.innerText = originalText, 1000);
        }

        // === 4. 训练逻辑 ===
        window.startTraining = async function() {
            if(isTraining) return;
            isTraining = true;
            stopRequested = false;
            
            toggleButtons(true);
            log("开始构建模型...", "log-info");

            // 1. Data Prep
            const inputs = [];
            const labels = [];
            dataset.data.forEach(s => {
                inputs.push(s.data);
                labels.push(s.label);
            });
            const xs = tf.tensor2d(inputs, [inputs.length, 784]);
            const ys = tf.oneHot(tf.tensor1d(labels, 'int32'), dataset.labels.length);

            // 2. Model Build
            model = tf.sequential();
            const configLayers = customModelConfig || [
                {units:32, activation:'relu'},
                {units:16, activation:'relu'},
                {units:dataset.labels.length, activation:'softmax'}
            ];

            configLayers.forEach((cfg, i) => {
                const layerParams = { units: cfg.units, activation: cfg.activation };
                if(i===0) layerParams.inputShape = [784];
                model.add(tf.layers.dense(layerParams));
            });

            const lr = parseFloat(document.getElementById('lr-select').value);
            model.compile({
                optimizer: tf.train.adam(lr),
                loss: 'categoricalCrossentropy',
                metrics: ['accuracy']
            });

            // 3. Train Loop
            const epochs = parseInt(document.getElementById('epoch-slider').value);
            const batchSize = parseInt(document.getElementById('batch-select').value);
            
            // Reset Viz
            chart.data.labels = [];
            chart.data.datasets.forEach(d => d.data = []);
            chart.update();
            animateNetwork(true);

            await model.fit(xs, ys, {
                epochs: epochs,
                batchSize: batchSize,
                shuffle: true,
                callbacks: {
                    onEpochEnd: async (epoch, logs) => {
                        if(stopRequested) {
                            model.stopTraining = true;
                            return;
                        }
                        updateStats(epoch+1, epochs, logs);
                        await tf.nextFrame();
                    }
                }
            });

            xs.dispose();
            ys.dispose();
            finishTraining();
        }

        window.stopTraining = function() {
            stopRequested = true;
            log("正在停止训练...", "log-info");
        }

        function finishTraining() {
            isTraining = false;
            animateNetwork(false);
            toggleButtons(false);
            document.getElementById('btn-export').style.display = 'flex';
            
            // Save Meta
            const meta = { labels: dataset.labels, trainedAt: Date.now() };
            localStorage.setItem('model_meta', JSON.stringify(meta));
            model.save('localstorage://trained_model');

            log("✅ 训练完成！模型已保存。", "log-success");
            
            if(confirm("训练完成！是否前往推理页面测试？")) {
                window.location.href = "Lab06_全流程推理.html";
            }
        }

        window.exportModel = async function() {
            await model.save('downloads://trained_model');
        }

        function toggleButtons(training) {
            document.getElementById('btn-start').style.display = training ? 'none' : 'flex';
            document.getElementById('btn-stop').style.display = training ? 'flex' : 'none';
            document.getElementById('btn-export').style.display = 'none';
        }

        function updateStats(epoch, total, logs) {
            document.getElementById('disp-loss').innerText = logs.loss.toFixed(4);
            document.getElementById('disp-acc').innerText = (logs.acc * 100).toFixed(1) + '%';
            document.getElementById('disp-epoch').innerText = `${epoch}/${total}`;
            
            chart.data.labels.push(epoch);
            chart.data.datasets[0].data.push(logs.loss);
            chart.data.datasets[1].data.push(logs.acc);
            chart.update('none');
            
            log(`Epoch ${epoch}: loss=${logs.loss.toFixed(4)}, acc=${logs.acc.toFixed(4)}`);
        }

        // === 5. 可视化 & 辅助 ===
        function animateNetwork(active) {
            if(!active) {
                cancelAnimationFrame(netAnimId);
                drawNetFrame(false, customModelConfig);
                return;
            }
            function loop() {
                drawNetFrame(true, customModelConfig);
                netAnimId = requestAnimationFrame(loop);
            }
            loop();
        }

        function drawNetFrame(active, layersConfig) {
            const w = netCanvas.width = netCanvas.offsetWidth;
            const h = netCanvas.height = netCanvas.offsetHeight;
            netCtx.clearRect(0,0,w,h);
            
            let layers = [];
            if(layersConfig) {
                layers = [10]; // Input placeholder
                layersConfig.forEach(l => {
                    let c = l.units;
                    if(c > 16) c = 8 + Math.log2(c);
                    layers.push(c);
                });
            } else {
                layers = [10, 8, dataset.labels.length];
            }
            
            const layerX = [];
            const step = w / (layers.length + 1);
            for(let i=1; i<=layers.length; i++) layerX.push(step * i);
            
            // Draw Edges
            netCtx.lineWidth = 1;
            for(let i=0; i<layers.length-1; i++) {
                const l1 = Math.floor(layers[i]);
                const l2 = Math.floor(layers[i+1]);
                for(let j=0; j<l1; j++) {
                    const y1 = (h - (l1-1)*15)/2 + j*15;
                    for(let k=0; k<l2; k++) {
                        const y2 = (h - (l2-1)*15)/2 + k*15;
                        netCtx.beginPath();
                        netCtx.moveTo(layerX[i], y1);
                        netCtx.lineTo(layerX[i+1], y2);
                        
                        if(active) {
                             netCtx.strokeStyle = `rgba(99, 102, 241, ${Math.random() > 0.9 ? 0.8 : 0.1})`;
                        } else {
                             netCtx.strokeStyle = "rgba(200,200,200,0.2)";
                        }
                        netCtx.stroke();
                    }
                }
            }
            
            // Draw Nodes
            layers.forEach((count, i) => {
                const c = Math.floor(count);
                const x = layerX[i];
                for(let j=0; j<c; j++) {
                    const y = (h - (c-1)*15)/2 + j*15;
                    netCtx.beginPath();
                    netCtx.arc(x, y, 4, 0, Math.PI*2);
                    netCtx.fillStyle = active && Math.random()>0.8 ? "#fff" : "#6366f1";
                    netCtx.fill();
                }
            });
        }

        function log(msg, cls='') {
            const div = document.createElement('div');
            div.className = cls;
            div.innerText = `> ${msg}`;
            const el = document.getElementById('terminal');
            el.appendChild(div);
            el.scrollTop = el.scrollHeight;
        }

        function updateCode() {
            const lr = document.getElementById('lr-select').value;
            const epochs = document.getElementById('epoch-slider').value;
            const structCode = document.getElementById('model-struct-input').value.trim();
            const code = `
<span class="kw">import</span> tensorflow <span class="kw">as</span> tf
<span class="kw">from</span> tensorflow.keras <span class="kw">import</span> layers, models

<span class="cmt"># 1. 定义模型结构</span>
${structCode}

<span class="cmt"># 2. 编译模型</span>
model.compile(
    optimizer=tf.keras.optimizers.Adam(learning_rate=<span class="num">${lr}</span>),
    loss=<span class="str">'categorical_crossentropy'</span>,
    metrics=[<span class="str">'accuracy'</span>]
)

<span class="cmt"># 3. 开始训练</span>
history = model.fit(
    x_train, y_train,
    epochs=<span class="num">${epochs}</span>,
    batch_size=<span class="num">16</span>
)
`;
            document.getElementById('code-preview').innerHTML = code;
        }

        // Slider listeners
        document.getElementById('epoch-slider').addEventListener('input', function() {
            document.getElementById('epoch-val').innerText = this.value;
            updateCode();
        });
        document.getElementById('lr-select').addEventListener('change', updateCode);

        // Init
        loadLocalDataset();
        drawNetFrame(false); // Initial draw
        
    </script>
</body>
</html>
