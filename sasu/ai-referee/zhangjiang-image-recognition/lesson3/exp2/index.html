<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神经网络训练 - 手写数字识别训练平台</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
    <script>
        // 检查TensorFlow.js是否成功加载
        window.addEventListener('DOMContentLoaded', function() {
            if (typeof tf === 'undefined') {
                console.warn('TensorFlow.js from jsdelivr failed, trying unpkg...');
                const script = document.createElement('script');
                script.src = 'https://unpkg.com/@tensorflow/tfjs@4.11.0/dist/tf.min.js';
                script.onload = function() {
                    if (typeof tf !== 'undefined') {
                        console.log('TensorFlow.js loaded successfully from unpkg');
                    }
                };
                script.onerror = function() {
                    console.error('Failed to load TensorFlow.js from both CDNs');
                    alert('TensorFlow.js库加载失败，请检查网络连接或尝试刷新页面。');
                };
                document.head.appendChild(script);
            } else {
                console.log('TensorFlow.js loaded successfully');
            }
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .training-layout {
            display: grid;
            grid-template-columns: 300px 1fr 350px;
            gap: 25px;
            margin-bottom: 25px;
        }
        
        .panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .panel h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }
        
        /* 训练数据输入区 */
        .data-input-panel {
            height: fit-content;
        }
        
        #trainCanvas {
            width: 260px;
            height: 260px;
            border: 3px solid #667eea;
            border-radius: 8px;
            background: white;
            cursor: crosshair;
            display: block;
            margin: 0 auto 15px;
            touch-action: none;
        }
        
        .digit-selector {
            margin: 15px 0;
        }
        
        .digit-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .digit-btn {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .digit-btn:hover {
            border-color: #667eea;
        }
        
        .digit-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        
        .controls {
            text-align: center;
            margin: 15px 0;
        }
        
        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn.danger {
            background: linear-gradient(45deg, #ff6b6b, #ff5252);
        }
        
        .btn.success {
            background: linear-gradient(45deg, #4CAF50, #45a049);
        }
        
        /* 训练过程可视化 */
        .training-panel {
            background: #2c3e50;
            color: white;
            min-height: 600px;
        }
        
        .training-panel h3 {
            color: #3498db;
            border-bottom-color: #3498db;
        }
        
        #trainingChart {
            width: 100%;
            height: 200px;
            border: 2px solid #34495e;
            border-radius: 8px;
            background: #34495e;
            margin-bottom: 20px;
        }
        
        .training-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-item {
            background: rgba(52, 73, 94, 0.5);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #3498db;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 5px;
        }
        
        .training-log {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
        }
        
        .log-entry {
            margin-bottom: 5px;
            opacity: 0.8;
        }
        
        .log-entry.success {
            color: #2ecc71;
        }
        
        .log-entry.error {
            color: #e74c3c;
        }
        
        /* 数据管理区 */
        .data-panel h3 {
            color: #e67e22;
            border-bottom-color: #e67e22;
        }
        
        .data-samples {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        
        .sample-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #e67e22;
        }
        
        .sample-canvas {
            width: 40px;
            height: 40px;
            border: 1px solid #ddd;
            margin-right: 15px;
            border-radius: 4px;
        }
        
        .sample-info {
            flex: 1;
        }
        
        .sample-digit {
            font-size: 1.2rem;
            font-weight: bold;
            color: #e67e22;
        }
        
        .sample-time {
            font-size: 0.8rem;
            color: #666;
        }
        
        .delete-sample {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #ecf0f1;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2980b9);
            transition: width 0.3s ease;
            border-radius: 10px;
        }
        
        @media (max-width: 1200px) {
            .training-layout {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
        
        .model-export {
            margin-top: 20px;
            padding: 15px;
            background: rgba(46, 204, 113, 0.1);
            border-radius: 8px;
            border: 2px solid #2ecc71;
        }
        
        .model-export h4 {
            color: #2ecc71;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 神经网络训练平台</h1>
            <p>手写数字识别模型训练 - 收集数据，训练模型，验证效果</p>
        </div>
        
        <div class="training-layout">
            <!-- 数据输入区 -->
            <div class="panel data-input-panel">
                <h3>✏️ 训练数据输入</h3>
                
                <canvas id="trainCanvas" width="260" height="260"></canvas>
                
                <div class="digit-selector">
                    <div style="margin-bottom: 10px; font-weight: bold; color: #333;">选择当前绘制的数字:</div>
                    <div class="digit-buttons">
                        <div class="digit-btn active" data-digit="0">0</div>
                        <div class="digit-btn" data-digit="1">1</div>
                        <div class="digit-btn" data-digit="2">2</div>
                        <div class="digit-btn" data-digit="3">3</div>
                        <div class="digit-btn" data-digit="4">4</div>
                        <div class="digit-btn" data-digit="5">5</div>
                        <div class="digit-btn" data-digit="6">6</div>
                        <div class="digit-btn" data-digit="7">7</div>
                        <div class="digit-btn" data-digit="8">8</div>
                        <div class="digit-btn" data-digit="9">9</div>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="btn" id="clearCanvas">清除</button>
                    <button class="btn success" id="addSample">添加样本</button>
                </div>
                
                <div style="font-size: 0.9rem; color: #666; text-align: center; margin-top: 15px;">
                    💡 选择数字，绘制后点击"添加样本"<br>
                    建议每个数字至少绘制10个不同样本
                </div>
            </div>
            
            <!-- 训练过程可视化 -->
            <div class="panel training-panel">
                <h3>🚀 模型训练过程</h3>
                
                <canvas id="trainingChart"></canvas>
                
                <div class="training-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="epochCount">0</div>
                        <div class="stat-label">训练轮数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="accuracy">0%</div>
                        <div class="stat-label">准确率</div>
                    </div>
                </div>
                
                <div class="progress-bar">
                    <div class="progress-fill" id="trainingProgress" style="width: 0%"></div>
                </div>
                
                <div class="controls">
                    <button class="btn success" id="startTraining">开始训练</button>
                    <button class="btn danger" id="stopTraining" disabled>停止训练</button>
                    <button class="btn" id="testModel" disabled>测试模型</button>
                </div>
                
                <div class="training-log" id="trainingLog">
                    <div class="log-entry">等待开始训练...</div>
                </div>
                
                <div class="model-export" id="modelExport" style="display: none;">
                    <h4>🎯 模型已训练完成</h4>
                    <button class="btn success" id="saveModel">保存模型</button>
                    <button class="btn" id="exportToDemo">导出到演示页面</button>
                </div>
            </div>
            
            <!-- 数据管理区 -->
            <div class="panel">
                <h3>📊 训练数据管理</h3>
                
                <!-- 数据操作按钮 -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                    <span style="font-weight: bold;">样本总数: <span id="totalSamples">0</span></span>
                    <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                        <button class="btn success" id="loadDatasetBtn">加载数据集</button>
                        <button class="btn" id="saveAsImagesBtn">保存为图片</button>
                        <button class="btn" id="saveDatasetBtn">保存JSON</button>
                        <button class="btn warning" id="importDataBtn">导入数据</button>
                        <button class="btn danger" id="clearAllData">清空数据</button>
                    </div>
                </div>
                
                <!-- 文件输入 -->
                <input type="file" id="datasetFileInput" style="display: none;" accept=".json,.csv" multiple>
                <input type="file" id="imageFileInput" style="display: none;" accept="image/*" multiple>
                
                <!-- 数据加载区域 -->
                <div id="dataLoadArea" style="display: none; margin-bottom: 20px; padding: 15px; background: #e8f5e8; border-radius: 8px; border-left: 4px solid #2ecc71;">
                    <h4 style="color: #2ecc71; margin-bottom: 10px;">📁 数据集加载</h4>
                    <div style="margin-bottom: 10px;">
                        <label style="margin-right: 15px;">
                            <input type="radio" name="loadType" value="mnist" checked> MNIST手写数字数据集
                        </label>
                        <label style="margin-right: 15px;">
                            <input type="radio" name="loadType" value="file"> 从文件加载
                        </label>
                        <label>
                            <input type="radio" name="loadType" value="images"> 图片文件夹
                        </label>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <button class="btn success" id="confirmLoadBtn">确认加载</button>
                        <button class="btn" id="cancelLoadBtn">取消</button>
                    </div>
                    <div id="loadProgress" style="display: none;">
                        <div style="margin-bottom: 5px;">加载进度:</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="loadProgressFill" style="width: 0%"></div>
                        </div>
                        <div style="font-size: 0.8rem; margin-top: 5px;" id="loadProgressText">准备中...</div>
                    </div>
                </div>
                
                <div class="data-samples" id="dataSamples">
                    <div style="text-align: center; color: #666; padding: 20px;">
                        还没有训练样本<br>
                        开始绘制数字添加样本吧！
                    </div>
                </div>
                
                <div style="margin-top: 20px;">
                    <h4 style="color: #e67e22; margin-bottom: 10px;">数字分布统计</h4>
                    <div id="digitStats">
                        <!-- 动态生成 -->
                    </div>
                </div>
                
                <!-- 数据质量分析 -->
                <div style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                    <h4 style="color: #3498db; margin-bottom: 10px;">📈 数据质量分析</h4>
                    <div id="dataQualityStats">
                        <div style="font-size: 0.9rem; color: #666;">
                            添加样本后显示数据质量统计
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class DigitTrainer {
            constructor() {
                this.canvas = document.getElementById('trainCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.chartCanvas = document.getElementById('trainingChart');
                this.chartCtx = this.chartCanvas.getContext('2d');
                
                this.isDrawing = false;
                this.currentDigit = 0;
                this.trainingData = [];
                this.model = null;
                this.isTraining = false;
                this.trainingHistory = [];
                
                console.log('训练平台初始化开始...');
                this.initializeCanvas();
                this.initializeEventListeners();
                this.initializeChart();
                this.updateDigitStats();
                console.log('训练平台初始化完成');
            }
            
            initializeCanvas() {
                this.ctx.strokeStyle = '#333';
                this.ctx.lineWidth = 8;
                this.ctx.lineCap = 'round';
                this.ctx.lineJoin = 'round';
                this.clearCanvas();
            }
            
            initializeEventListeners() {
                // 绘图事件
                this.canvas.addEventListener('mousedown', (e) => this.startDrawing(e));
                this.canvas.addEventListener('mousemove', (e) => this.draw(e));
                this.canvas.addEventListener('mouseup', () => this.stopDrawing());
                this.canvas.addEventListener('mouseout', () => this.stopDrawing());
                
                // 触摸事件
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousedown', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    this.canvas.dispatchEvent(mouseEvent);
                });
                
                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousemove', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    this.canvas.dispatchEvent(mouseEvent);
                });
                
                this.canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.stopDrawing();
                });
                
                // 数字选择
                document.querySelectorAll('.digit-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.digit-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.currentDigit = parseInt(btn.dataset.digit);
                    });
                });
                
                // 按钮事件
                document.getElementById('clearCanvas').addEventListener('click', () => this.clearCanvas());
                document.getElementById('addSample').addEventListener('click', () => this.addSample());
                document.getElementById('clearAllData').addEventListener('click', () => this.clearAllData());
                document.getElementById('startTraining').addEventListener('click', () => this.startTraining());
                document.getElementById('stopTraining').addEventListener('click', () => this.stopTraining());
                document.getElementById('testModel').addEventListener('click', () => this.testModel());
                document.getElementById('saveModel').addEventListener('click', () => this.saveModel());
                document.getElementById('exportToDemo').addEventListener('click', () => this.exportToDemo());
                
                // 数据管理按钮事件
                document.getElementById('loadDatasetBtn').addEventListener('click', () => this.showLoadDataArea());
                document.getElementById('saveAsImagesBtn').addEventListener('click', () => this.saveAsImages());
                document.getElementById('saveDatasetBtn').addEventListener('click', () => this.saveDataset());
                document.getElementById('importDataBtn').addEventListener('click', () => this.importData());
                document.getElementById('confirmLoadBtn').addEventListener('click', () => this.confirmLoadData());
                document.getElementById('cancelLoadBtn').addEventListener('click', () => this.hideLoadDataArea());
                
                // 文件输入事件
                document.getElementById('datasetFileInput').addEventListener('change', (e) => this.handleDatasetFileUpload(e.target.files));
                document.getElementById('imageFileInput').addEventListener('change', (e) => this.handleImageFileUpload(e.target.files));
            }
            
            initializeChart() {
                const canvas = this.chartCanvas;
                canvas.width = canvas.offsetWidth;
                canvas.height = 200;
                this.drawChart();
            }
            
            getMousePos(e) {
                const rect = this.canvas.getBoundingClientRect();
                const scaleX = this.canvas.width / rect.width;
                const scaleY = this.canvas.height / rect.height;
                
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            }
            
            startDrawing(e) {
                this.isDrawing = true;
                const pos = this.getMousePos(e);
                this.ctx.beginPath();
                this.ctx.moveTo(pos.x, pos.y);
            }
            
            draw(e) {
                if (!this.isDrawing) return;
                const pos = this.getMousePos(e);
                this.ctx.lineTo(pos.x, pos.y);
                this.ctx.stroke();
            }
            
            stopDrawing() {
                this.isDrawing = false;
            }
            
            clearCanvas() {
                this.ctx.fillStyle = '#ffffff';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            }
            
            addSample() {
                // 检查画布是否有内容
                const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                const data = imageData.data;
                let hasContent = false;
                
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i] < 250 || data[i + 1] < 250 || data[i + 2] < 250) {
                        hasContent = true;
                        break;
                    }
                }
                
                if (!hasContent) {
                    alert('请先在画布上绘制数字！');
                    return;
                }
                
                // 预处理图像数据
                const processedData = this.preprocessImage();
                
                // 添加到训练数据
                const sample = {
                    data: processedData,
                    label: this.currentDigit,
                    timestamp: new Date().toLocaleTimeString()
                };
                
                this.trainingData.push(sample);
                this.updateDataDisplay();
                this.updateDigitStats();
                this.clearCanvas();
                
                this.log(`添加样本: 数字 ${this.currentDigit}`, 'success');
            }
            
            preprocessImage() {
                // 获取图像数据
                const imageData = this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height);
                const data = imageData.data;
                
                // 找到内容边界
                let minX = this.canvas.width, maxX = 0, minY = this.canvas.height, maxY = 0;
                let hasContent = false;
                
                for (let y = 0; y < this.canvas.height; y++) {
                    for (let x = 0; x < this.canvas.width; x++) {
                        const index = (y * this.canvas.width + x) * 4;
                        const brightness = (data[index] + data[index + 1] + data[index + 2]) / 3;
                        
                        if (brightness < 240) {
                            hasContent = true;
                            minX = Math.min(minX, x);
                            maxX = Math.max(maxX, x);
                            minY = Math.min(minY, y);
                            maxY = Math.max(maxY, y);
                        }
                    }
                }
                
                if (!hasContent) return new Array(784).fill(0);
                
                // 创建方形区域并缩放到28x28
                const padding = 20;
                minX = Math.max(0, minX - padding);
                maxX = Math.min(this.canvas.width - 1, maxX + padding);
                minY = Math.max(0, minY - padding);
                maxY = Math.min(this.canvas.height - 1, maxY + padding);
                
                const size = Math.max(maxX - minX + 1, maxY - minY + 1);
                const centerX = (minX + maxX) / 2;
                const centerY = (minY + maxY) / 2;
                
                const squareMinX = Math.max(0, Math.round(centerX - size / 2));
                const squareMinY = Math.max(0, Math.round(centerY - size / 2));
                
                // 缩放到28x28 - 优化预处理算法
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = 28;
                tempCanvas.height = 28;
                const tempCtx = tempCanvas.getContext('2d');
                
                // 填充白色背景
                tempCtx.fillStyle = '#ffffff';
                tempCtx.fillRect(0, 0, 28, 28);
                
                // 使用更好的缩放算法：先设置图像平滑
                tempCtx.imageSmoothingEnabled = true;
                tempCtx.imageSmoothingQuality = 'high';
                
                // 在中心位置绘制，保持纵横比
                const drawSize = 20; // 在28x28中心绘制20x20
                const offset = (28 - drawSize) / 2;
                tempCtx.drawImage(this.canvas, squareMinX, squareMinY, size, size, offset, offset, drawSize, drawSize);
                
                // 转换为归一化数据
                const scaledData = tempCtx.getImageData(0, 0, 28, 28);
                const processedData = [];
                
                for (let i = 0; i < scaledData.data.length; i += 4) {
                    const gray = (scaledData.data[i] + scaledData.data[i + 1] + scaledData.data[i + 2]) / 3;
                    processedData.push((255 - gray) / 255);
                }
                
                return processedData;
            }
            
            updateDataDisplay() {
                const container = document.getElementById('dataSamples');
                const totalSamples = document.getElementById('totalSamples');
                
                totalSamples.textContent = this.trainingData.length;
                
                if (this.trainingData.length === 0) {
                    container.innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">还没有训练样本<br>开始绘制数字添加样本吧！</div>';
                    return;
                }
                
                // 显示最近的10个样本
                const recentSamples = this.trainingData.slice(-10).reverse();
                container.innerHTML = '';
                
                recentSamples.forEach((sample, index) => {
                    const sampleDiv = document.createElement('div');
                    sampleDiv.className = 'sample-item';
                    
                    const canvas = document.createElement('canvas');
                    canvas.className = 'sample-canvas';
                    canvas.width = 28;
                    canvas.height = 28;
                    const ctx = canvas.getContext('2d');
                    
                    // 绘制样本图像
                    const imageData = ctx.createImageData(28, 28);
                    for (let i = 0; i < sample.data.length; i++) {
                        const value = Math.floor((1 - sample.data[i]) * 255);
                        imageData.data[i * 4] = value;
                        imageData.data[i * 4 + 1] = value;
                        imageData.data[i * 4 + 2] = value;
                        imageData.data[i * 4 + 3] = 255;
                    }
                    ctx.putImageData(imageData, 0, 0);
                    
                    // 获取数据源信息
                    const source = sample.source || '手绘';
                    const sourceColor = sample.source && sample.source.includes('MNIST') ? '#3498db' : 
                                       sample.source && sample.source.includes('图片') ? '#e67e22' : 
                                       sample.source && sample.source.includes('JSON') ? '#9b59b6' : 
                                       sample.source && sample.source.includes('CSV') ? '#1abc9c' : '#2ecc71';
                    
                    sampleDiv.innerHTML = `
                        <div class="sample-info">
                            <div class="sample-digit">数字 ${sample.label}</div>
                            <div class="sample-time">${sample.timestamp}</div>
                            <div class="sample-source" style="color: ${sourceColor}; font-size: 0.7rem; margin-top: 2px;">${source}</div>
                        </div>
                        <button class="delete-sample" onclick="trainer.deleteSample(${this.trainingData.length - 1 - index})">删除</button>
                    `;
                    
                    sampleDiv.insertBefore(canvas, sampleDiv.firstChild);
                    container.appendChild(sampleDiv);
                });
                
                // 更新数据质量分析
                this.updateDataQuality();
            }
            
            updateDigitStats() {
                const stats = {};
                for (let i = 0; i < 10; i++) stats[i] = 0;
                
                this.trainingData.forEach(sample => {

                });
                
                const container = document.getElementById('digitStats');
                container.innerHTML = '';
                
                for (let digit = 0; digit < 10; digit++) {
                    const statDiv = document.createElement('div');

                    statDiv.innerHTML = `
                        <span>数字 ${digit}:</span>

                    `;
                    container.appendChild(statDiv);
                }
            }
            
            deleteSample(index) {

                this.updateDataDisplay();

                if (confirm('确定要清空所有训练数据吗？')) {

            async startTraining() {
                if (this.trainingData.length < 10) {
                    alert('至少需要10个训练样本才能开始训练！');
                    return;
                }
                
                // 检查数据分布
                const digitCounts = {};
                for (let i = 0; i < 10; i++) digitCounts[i] = 0;
                this.trainingData.forEach(sample => digitCounts[sample.label]++);
                
                const missingDigits = [];
                for (let i = 0; i < 10; i++) {
                    if (digitCounts[i] === 0) missingDigits.push(i);
                }
                
                if (missingDigits.length > 0) {
                    alert(`缺少数字 ${missingDigits.join(', ')} 的训练样本！建议每个数字至少有1个样本。`);
                    return;
                }
                
                this.isTraining = true;
                document.getElementById('startTraining').disabled = true;
                document.getElementById('stopTraining').disabled = false;
                document.getElementById('testModel').disabled = true;
                
                this.log('开始训练神经网络...', 'success');
                
                try {
                    await this.trainModel();
                } catch (error) {
                    this.log(`训练出错: ${error.message}`, 'error');
                } finally {
                    this.isTraining = false;
                    document.getElementById('startTraining').disabled = false;
                    document.getElementById('stopTraining').disabled = true;
                    document.getElementById('testModel').disabled = false;
                }
            }
            
            async trainModel() {
                // 检查TensorFlow.js是否已加载
                if (typeof tf === 'undefined') {
                    throw new Error('TensorFlow.js未正确加载，请刷新页面重试');
                }
                
                this.log('TensorFlow.js版本: ' + tf.version.tfjs);
                
                // 创建模型
                this.model = tf.sequential({
                    layers: [
                        tf.layers.flatten({inputShape: [28, 28, 1]}),
                        tf.layers.dense({units: 256, activation: 'relu'}),
                        tf.layers.dropout({rate: 0.1}),
                        tf.layers.dense({units: 128, activation: 'relu'}),
                        tf.layers.dropout({rate: 0.1}),
                        tf.layers.dense({units: 64, activation: 'relu'}),
                        tf.layers.dense({units: 10, activation: 'softmax'})
                    ]
                });
                
                this.model.compile({
                    optimizer: tf.train.adam(0.001),
                    loss: 'categoricalCrossentropy',
                    metrics: ['accuracy']
                });
                
                // 准备训练数据
                const batchSize = this.trainingData.length;
                console.log(`准备 ${batchSize} 个训练样本`);
                
                // 创建图像张量 - 使用tf.stack方法
                const imageTensors = this.trainingData.map(sample => {
                    return tf.tensor3d(sample.data, [28, 28, 1]);
                });
                const xs = tf.stack(imageTensors);
                
                // 创建标签张量
                const labels = this.trainingData.map(sample => {
                    const label = new Array(10).fill(0);
                    label[sample.label] = 1;
                    return label;
                });
                const ys = tf.tensor2d(labels);
                
                // 清理临时张量
                imageTensors.forEach(tensor => tensor.dispose());
                
                this.log(`准备训练数据: ${batchSize} 个样本`);
                
                // 训练参数
                const epochs = 50;
                // 改进批大小计算：确保至少8个样本，最多32个
                const trainBatchSize = Math.min(32, Math.max(8, Math.floor(batchSize / 2)));
                
                this.log(`开始训练: ${epochs} 轮, 批大小 ${trainBatchSize}`);
                
                // 训练模型
                await this.model.fit(xs, ys, {
                    epochs: epochs,
                    batchSize: trainBatchSize,
                    validationSplit: 0.2,
                    shuffle: true,
                    callbacks: {
                        onEpochEnd: (epoch, logs) => {
                            if (!this.isTraining) return;
                            
                            const progress = ((epoch + 1) / epochs) * 100;
                            document.getElementById('trainingProgress').style.width = progress + '%';
                            document.getElementById('epochCount').textContent = epoch + 1;
                            document.getElementById('accuracy').textContent = (logs.acc * 100).toFixed(1) + '%';
                            
                            this.trainingHistory.push({
                                epoch: epoch + 1,
                                loss: logs.loss,
                                accuracy: logs.acc,
                                valLoss: logs.val_loss || 0,
                                valAccuracy: logs.val_acc || 0
                            });
                            
                            this.drawChart();
                            this.log(`第 ${epoch + 1} 轮: 准确率 ${(logs.acc * 100).toFixed(1)}%, 损失 ${logs.loss.toFixed(4)}`);
                        }
                    }
                });
                
                // 清理张量
                xs.dispose();
                ys.dispose();
                
                this.log('训练完成！', 'success');
                document.getElementById('modelExport').style.display = 'block';
            }
            
            stopTraining() {
                this.isTraining = false;
                this.log('训练已停止', 'error');
            }
            
            drawChart() {
                const ctx = this.chartCtx;
                const canvas = this.chartCanvas;
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (this.trainingHistory.length === 0) {
                    ctx.fillStyle = '#7f8c8d';
                    ctx.font = '16px Microsoft YaHei';
                    ctx.textAlign = 'center';
                    ctx.fillText('等待训练数据...', canvas.width / 2, canvas.height / 2);
                    return;
                }
                
                const maxEpoch = Math.max(...this.trainingHistory.map(h => h.epoch));
                const maxLoss = Math.max(...this.trainingHistory.map(h => h.loss));
                
                // 绘制准确率曲线
                ctx.strokeStyle = '#2ecc71';
                ctx.lineWidth = 2;
                ctx.beginPath();
                
                this.trainingHistory.forEach((point, index) => {
                    const x = (point.epoch / maxEpoch) * (canvas.width - 60) + 30;
                    const y = canvas.height - 30 - (point.accuracy * (canvas.height - 60));
                    
                    if (index === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();
                
                // 绘制损失曲线
                ctx.strokeStyle = '#e74c3c';
                ctx.lineWidth = 2;
                ctx.beginPath();
                
                this.trainingHistory.forEach((point, index) => {
                    const x = (point.epoch / maxEpoch) * (canvas.width - 60) + 30;
                    // 修复损失曲线显示错误：直接使用损失值，不进行反转
                    const y = canvas.height - 30 - ((point.loss / maxLoss) * (canvas.height - 60));
                    
                    if (index === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();
                
                // 绘制图例
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(canvas.width - 120, 10, 15, 15);
                ctx.fillStyle = '#ecf0f1';
                ctx.font = '12px Microsoft YaHei';
                ctx.textAlign = 'left';
                ctx.fillText('准确率', canvas.width - 100, 22);
                
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(canvas.width - 120, 30, 15, 15);
                ctx.fillStyle = '#ecf0f1';
                ctx.fillText('损失', canvas.width - 100, 42);
            }

                        for (let i = 0; i < 10; i++) {
                            this.updateLoadProgress((digit * 10 + i) / sampleCount * 100, 
                                `生成数字 ${digit} 样本 ${i + 1}/10`);

                            });

                } finally {

                }
            }
            
            generateMNISTLikeSample(digit) {
                // 生成类似MNIST的28x28数字图像数据
                const data = new Array(784).fill(0);
                
                // 基于数字的简单模式生成
                const patterns = {
                    0: [[10,12], [10,16], [14,12], [14,16], [12,10], [12,18]], // O形状
                    1: [[13,10], [13,11], [13,12], [13,13], [13,14], [13,15]], // 垂直线
                    2: [[10,12], [11,11], [12,12], [13,13], [14,14], [15,15]], // Z形状
                    3: [[10,12], [11,12], [12,13], [13,12], [14,12]], // 弯曲
                    4: [[10,14], [11,13], [12,12], [13,12], [14,12]], // 4形状
                    5: [[10,11], [10,12], [11,12], [12,13], [13,14]], // S形状
                    6: [[10,13], [11,12], [12,12], [13,13], [14,14]], // 6形状
                    7: [[10,10], [11,11], [12,12], [13,13], [14,14]], // 斜线
                    8: [[10,12], [11,11], [11,13], [12,12], [13,11], [13,13]], // 8形状
                    9: [[10,12], [11,11], [12,12], [13,13], [14,12]] // 9形状
                };
                
                const pattern = patterns[digit] || patterns[0];
                
                // 在模式点周围添加像素
                pattern.forEach(([x, y]) => {
                    for (let dx = -1; dx <= 1; dx++) {
                        for (let dy = -1; dy <= 1; dy++) {
                            const nx = x + dx;
                            const ny = y + dy;
                            if (nx >= 0 && nx < 28 && ny >= 0 && ny < 28) {
                                const index = nx * 28 + ny;
                                data[index] = Math.random() * 0.5 + 0.5; // 0.5-1.0的随机值
                            }
                        }
                    }
                });
                
                // 添加一些噪声
                for (let i = 0; i < 20; i++) {
                    const randomIndex = Math.floor(Math.random() * 784);
                    data[randomIndex] = Math.random() * 0.3;
                }
                
                return data;
            }

            async processImageFile(file) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = () => {
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = 28;
                        tempCanvas.height = 28;
                        const tempCtx = tempCanvas.getContext('2d');
                        
                        tempCtx.fillStyle = '#ffffff';
                        tempCtx.fillRect(0, 0, 28, 28);
                        tempCtx.drawImage(img, 0, 0, 28, 28);
                        
                        const imageData = tempCtx.getImageData(0, 0, 28, 28);
                        const processedData = [];
                        
                        for (let i = 0; i < imageData.data.length; i += 4) {
                            const gray = (imageData.data[i] + imageData.data[i + 1] + imageData.data[i + 2]) / 3;
                            processedData.push((255 - gray) / 255);
                        }
                        
                        const label = this.extractLabelFromFilename(file.name);
                        
                        resolve({
                            data: processedData,
                            label: label,
                            timestamp: new Date().toLocaleTimeString(),
                            source: `图片: ${file.name}`
                        });
                    };
                    
                    img.src = URL.createObjectURL(file);
                });
            }
            
            extractLabelFromFilename(filename) {
                const match = filename.match(/(\d+)/);
                return match ? parseInt(match[1]) : 0;
            }
            
            async readJSONFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const data = JSON.parse(e.target.result);
                            // 确保数据格式正确
                            const processedData = data.map(item => ({
                                data: item.data,
                                label: item.label,
                                timestamp: new Date().toLocaleTimeString(),
                                source: `JSON: ${file.name}`
                            }));
                            resolve(processedData);
                        } catch (error) {
                            reject(error);
                        }
                    };
                    reader.readAsText(file);
                });
            }
            
            async readCSVFile(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const csvText = e.target.result;
                            const lines = csvText.split('\n');
                            const processedData = [];
                            
                            for (let i = 1; i < lines.length; i++) { // 跳过标题行
                                const values = lines[i].split(',');
                                if (values.length >= 785) { // 标签 + 784像素
                                    const label = parseInt(values[0]);
                                    const data = values.slice(1).map(val => parseFloat(val) / 255);
                                    processedData.push({
                                        data: data,
                                        label: label,
                                        timestamp: new Date().toLocaleTimeString(),
                                        source: `CSV: ${file.name}`
                                    });
                                }
                            }
                            
                            resolve(processedData);
                        } catch (error) {
                            reject(error);
                        }
                    };
                    reader.readAsText(file);
                });
            }
            
            saveAsImages() {

            async saveImagesAsZip() {
                // 由于浏览器环境限制，我们将逐个下载图片
                // 实际应用中可以使用JSZip库来创建ZIP文件
                
                const timestamp = new Date().toISOString().split('T')[0];
                let downloadCount = 0;
                
                for (let i = 0; i < this.trainingData.length; i++) {
                    const sample = this.trainingData[i];
                    
                    // 创建临时canvas来生成图片
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = 28;
                    tempCanvas.height = 28;
                    const tempCtx = tempCanvas.getContext('2d');
                    
                    // 将数据绘制到canvas
                    const imageData = tempCtx.createImageData(28, 28);
                    for (let j = 0; j < sample.data.length; j++) {
                        const value = Math.floor((1 - sample.data[j]) * 255);
                        imageData.data[j * 4] = value;     // R
                        imageData.data[j * 4 + 1] = value; // G
                        imageData.data[j * 4 + 2] = value; // B
                        imageData.data[j * 4 + 3] = 255;   // A
                    }
                    tempCtx.putImageData(imageData, 0, 0);
                    
                    // 转换为Blob并下载
                    tempCanvas.toBlob((blob) => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `digit_${sample.label}_${i + 1}_${timestamp}.png`;
                        
                        // 添加延迟下载，避免浏览器阻止多个下载
                        setTimeout(() => {
                            a.click();
                            URL.revokeObjectURL(url);
                            downloadCount++;
                            
                            if (downloadCount === this.trainingData.length) {
                                this.log(`✅ 已保存 ${downloadCount} 张图片`, 'success');
                            }
                        }, i * 100); // 每100ms下载一张
                        
                    }, 'image/png');
                }
                
                // 同时生成一个标签文件
                this.generateLabelFile(timestamp);
            }
            
            generateLabelFile(timestamp) {
                // 生成包含标签信息的CSV文件
                let csvContent = 'filename,label,timestamp,source\n';
                
                this.trainingData.forEach((sample, index) => {
                    const filename = `digit_${sample.label}_${index + 1}_${timestamp}.png`;
                    const source = sample.source || '手绘';
                    csvContent += `${filename},${sample.label},${sample.timestamp || ''},${source}\n`;
                });
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `labels_${timestamp}.csv`;
                a.click();
                URL.revokeObjectURL(url);
                
                this.log('标签文件已生成', 'success');
            }
            
            // 批量保存图片的改进版本
            async saveAsImagesBatch() {
                if (this.trainingData.length === 0) {
                    this.log('没有数据可保存', 'error');
                    return;
                }
                
                this.log('开始批量保存图片...', 'info');
                
                // 创建一个大的canvas包含所有图片
                const cols = 10; // 每行10张图片
                const rows = Math.ceil(this.trainingData.length / cols);
                const cellSize = 32; // 每个图片32x32像素
                const spacing = 4; // 图片间距
                
                const totalWidth = cols * (cellSize + spacing) - spacing;
                const totalHeight = rows * (cellSize + spacing) - spacing;
                
                const batchCanvas = document.createElement('canvas');
                batchCanvas.width = totalWidth;
                batchCanvas.height = totalHeight;
                const batchCtx = batchCanvas.getContext('2d');
                
                // 填充白色背景
                batchCtx.fillStyle = '#ffffff';
                batchCtx.fillRect(0, 0, totalWidth, totalHeight);
                
                // 绘制所有图片
                for (let i = 0; i < this.trainingData.length; i++) {
                    const sample = this.trainingData[i];
                    const row = Math.floor(i / cols);
                    const col = i % cols;
                    
                    const x = col * (cellSize + spacing);
                    const y = row * (cellSize + spacing);
                    
                    // 创建临时canvas
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = 28;
                    tempCanvas.height = 28;
                    const tempCtx = tempCanvas.getContext('2d');
                    
                    // 绘制数据
                    const imageData = tempCtx.createImageData(28, 28);
                    for (let j = 0; j < sample.data.length; j++) {
                        const value = Math.floor((1 - sample.data[j]) * 255);
                        imageData.data[j * 4] = value;
                        imageData.data[j * 4 + 1] = value;
                        imageData.data[j * 4 + 2] = value;
                        imageData.data[j * 4 + 3] = 255;
                    }
                    tempCtx.putImageData(imageData, 0, 0);
                    
                    // 绘制到大canvas
                    batchCtx.drawImage(tempCanvas, x, y, cellSize, cellSize);
                    
                    // 添加标签
                    batchCtx.fillStyle = '#000000';
                    batchCtx.font = '10px Arial';
                    batchCtx.fillText(sample.label.toString(), x + cellSize - 8, y + cellSize - 2);
                }
                
                // 下载大图
                batchCanvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `training_data_batch_${new Date().toISOString().split('T')[0]}.png`;
                    a.click();
                    URL.revokeObjectURL(url);
                    
                    this.log('✅ 批量图片已保存', 'success');
                }, 'image/png');
            }
            
            saveDataset() {
                if (this.trainingData.length === 0) {
                    this.log('没有数据可保存', 'error');
                    return;
                }
                
                const datasetData = {
                    metadata: {
                        totalSamples: this.trainingData.length,
                        exportTime: new Date().toISOString(),
                        version: '1.0'
                    },
                    samples: this.trainingData
                };
                
                const blob = new Blob([JSON.stringify(datasetData, null, 2)], {
                    type: 'application/json'
                });
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `training_dataset_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                
                this.log('训练数据集已保存为JSON格式', 'success');
            }
            
            importData() {
                document.getElementById('datasetFileInput').click();
            }
            
            updateDataQuality() {
                if (this.trainingData.length === 0) {
                    document.getElementById('dataQualityStats').innerHTML = `
                        <div style="font-size: 0.9rem; color: #666;">
                            添加样本后显示数据质量统计
                        </div>
                    `;
                    return;
                }
                
                // 计算数据质量指标
                const stats = this.calculateDataQuality();
                
                document.getElementById('dataQualityStats').innerHTML = `
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9rem;">
                        <div><strong>数据平衡度:</strong> ${stats.balance}</div>
                        <div><strong>平均亮度:</strong> ${stats.avgBrightness.toFixed(2)}</div>
                        <div><strong>覆盖率:</strong> ${stats.coverage}%</div>
                        <div><strong>质量评分:</strong> ${stats.quality}</div>
                    </div>
                `;
            }
            
            calculateDataQuality() {
                const digitCounts = {};
                let totalBrightness = 0;
                
                // 统计每个数字的样本数
                this.trainingData.forEach(sample => {
                    digitCounts[sample.label] = (digitCounts[sample.label] || 0) + 1;
                    
                    // 计算平均亮度
                    const brightness = sample.data.reduce((sum, val) => sum + val, 0) / sample.data.length;
                    totalBrightness += brightness;
                });
                
                // 计算数据平衡度
                const counts = Object.values(digitCounts);
                const maxCount = Math.max(...counts);
                const minCount = Math.min(...counts);
                const balance = minCount === 0 ? '不平衡' : (minCount / maxCount > 0.7 ? '良好' : '一般');
                
                // 计算覆盖率
                const coverage = Object.keys(digitCounts).length * 10;
                
                // 计算平均亮度
                const avgBrightness = totalBrightness / this.trainingData.length;
                
                // 质量评分
                let qualityScore = 0;
                if (coverage === 100) qualityScore += 40;
                if (balance === '良好') qualityScore += 30;
                else if (balance === '一般') qualityScore += 15;
                if (this.trainingData.length >= 50) qualityScore += 20;
                if (avgBrightness > 0.1 && avgBrightness < 0.8) qualityScore += 10;
                
                const quality = qualityScore >= 80 ? '优秀' : qualityScore >= 60 ? '良好' : '一般';
                
                return { balance, avgBrightness, coverage, quality };
            }
            
            showLoadProgress() {
                document.getElementById('loadProgress').style.display = 'block';
            }
            
            hideLoadProgress() {
                document.getElementById('loadProgress').style.display = 'none';
            }
            
            updateLoadProgress(percentage, text) {
                document.getElementById('loadProgressFill').style.width = percentage + '%';
                document.getElementById('loadProgressText').textContent = text;
            }
            
            delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
        }
        
        // 全局变量，供删除按钮调用
        let trainer;
        
        // 初始化训练器的函数
        function initializeTrainer() {
            if (typeof tf === 'undefined') {
                console.log('等待TensorFlow.js加载...');
                setTimeout(initializeTrainer, 500);
                return;
            }
            trainer = new DigitTrainer();
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initializeTrainer, 100);
        });
    </script>
</body>
