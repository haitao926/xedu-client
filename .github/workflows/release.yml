name: Official Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build (for example v2.0.0-rc.5)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xedu-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-ref.outputs.tag }}
      source_commit: ${{ steps.release-ref.outputs.commit }}
    steps:
      - name: Checkout requested release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release-ref
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || {
            echo "Expected an exact version tag, got: $tag" >&2
            exit 1
          }
          commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-list -n 1 "$tag^{commit}")"
          test "$commit" = "$tag_commit" || {
            echo "Checked out commit does not match tag $tag" >&2
            exit 1
          }
          version="$(node -p "require('./package.json').version")"
          version_pattern="${version//./\\.}"
          [[ "$tag" =~ ^v${version_pattern}(-rc\.[0-9]+)?$ ]] || {
            echo "Tag $tag does not match package version $version" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Scratch dependencies
        run: npm ci --prefix scratch-editor

      - name: Validate protected release credentials
        env:
          XEDU_CHECKPOINT_BUNDLE_URL: ${{ secrets.XEDU_CHECKPOINT_BUNDLE_URL }}
          XEDU_CHECKPOINT_BUNDLE_SHA256: ${{ secrets.XEDU_CHECKPOINT_BUNDLE_SHA256 }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            XEDU_CHECKPOINT_BUNDLE_URL \
            XEDU_CHECKPOINT_BUNDLE_SHA256 \
            WIN_CSC_LINK \
            WIN_CSC_KEY_PASSWORD \
            CSC_LINK \
            CSC_KEY_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing protected release secrets:\n' >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Provision checkpoint bundle
        env:
          XEDU_CHECKPOINT_BUNDLE_URL: ${{ secrets.XEDU_CHECKPOINT_BUNDLE_URL }}
          XEDU_CHECKPOINT_BUNDLE_SHA256: ${{ secrets.XEDU_CHECKPOINT_BUNDLE_SHA256 }}
        run: node scripts/provision_checkpoint_bundle.mjs

      - name: Install backend test dependencies and smoke model builder
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements_ci.txt numpy==1.26.4 onnx==1.22.0
          python scripts/seed_xedu_smoke_models.py
          python scripts/seed_xedu_smoke_assets.py

      - name: Run complete quality gate
        run: npm run quality-gate

      - name: Prepare dependency audit evidence
        shell: bash
        run: mkdir -p release-evidence/dependency-audit

      - name: Audit root npm lockfile
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --package-lock-only --json > release-evidence/dependency-audit/root-npm.json 2>&1
          printf '%s\n' "$?" > release-evidence/dependency-audit/root-npm.exit

      - name: Audit Scratch npm lockfile
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm audit --prefix scratch-editor --audit-level=high --package-lock-only --json > release-evidence/dependency-audit/scratch-npm.json 2>&1
          printf '%s\n' "$?" > release-evidence/dependency-audit/scratch-npm.exit

      - name: Audit fixed Python direct dependencies
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pip install pip-audit
          awk 'NF && $1 !~ /^#/ && $1 ~ /^[A-Za-z0-9_.-]+==[^;[:space:]]+$/' backend/requirements.txt > /tmp/xedu-pinned-requirements.txt
          python -m pip_audit -r /tmp/xedu-pinned-requirements.txt --no-deps --format json > release-evidence/dependency-audit/python-fixed.json 2>&1
          printf '%s\n' "$?" > release-evidence/dependency-audit/python-fixed.exit

      - name: Resolve and audit complete Python requirements
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pip_audit -r backend/requirements.txt --format json > release-evidence/dependency-audit/python-minimal.json 2>&1
          printf '%s\n' "$?" > release-evidence/dependency-audit/python-minimal.exit
          python -m pip_audit -r backend/requirements_full.txt --format json > release-evidence/dependency-audit/python-full.json 2>&1
          printf '%s\n' "$?" > release-evidence/dependency-audit/python-full.exit

      - name: Enforce dependency audit gate
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          status=0
          evidence_dir='release-evidence/dependency-audit'
          if [[ ! -d "$evidence_dir" ]]; then
            echo 'Dependency audit evidence directory is missing because an earlier release prerequisite failed.' >&2
            exit 1
          fi
          shopt -s nullglob
          files=("$evidence_dir"/*.exit)
          if (( ${#files[@]} == 0 )); then
            echo 'No dependency audit exit files were produced.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            if [[ "$file" == *scratch-npm.exit ]]; then
              continue
            fi
            code="$(cat "$file")"
            if [[ "$code" != "0" ]]; then
              echo "Dependency audit failed: $file (exit $code)"
              status=1
            fi
          done
          exit "$status"

      - name: Enforce Scratch dependency exception and reachability gate
        run: |
          node scripts/check_scratch_dependency_gate.mjs \
            --audit release-evidence/dependency-audit/scratch-npm.json \
            --exceptions docs/release/2.0.0-rc.5/SCRATCH_DEPENDENCY_EXCEPTIONS.json \
            --build scratch-editor/build \
            --report release-evidence/dependency-audit/scratch-reachability.json

      - name: Upload dependency audit evidence
        if: always() && hashFiles('release-evidence/dependency-audit/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: xedu-client-${{ github.run_id }}-dependency-audit
          path: release-evidence/dependency-audit
          if-no-files-found: warn

  windows-release:
    runs-on: windows-2022
    needs: quality-gate
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.quality-gate.outputs.source_commit }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Scratch dependencies
        run: npm ci --prefix scratch-editor

      - name: Provision checkpoint bundle
        env:
          XEDU_CHECKPOINT_BUNDLE_URL: ${{ secrets.XEDU_CHECKPOINT_BUNDLE_URL }}
          XEDU_CHECKPOINT_BUNDLE_SHA256: ${{ secrets.XEDU_CHECKPOINT_BUNDLE_SHA256 }}
        run: node scripts/provision_checkpoint_bundle.mjs

      - name: Check release model assets
        run: node scripts/check_release_inputs.mjs

      - name: Clean release output
        shell: pwsh
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue dist-release, release-evidence

      - name: Build signed Windows release
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run electron:build:release

      - name: Verify packaged contents and write manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-evidence | Out-Null
          $installer = (Get-ChildItem -Path dist-release -Filter *.exe -File | Select-Object -First 1).FullName
          if (-not $installer) { throw 'Windows installer was not produced.' }
          if ((Split-Path $installer -Leaf) -ne 'XEdu Client-2.0.0.exe') { throw "Unexpected installer name: $installer" }
          $signedFiles = @($installer, (Join-Path (Resolve-Path dist-release/win-unpacked) 'XEdu Client.exe'))
          $uninstaller = Get-ChildItem -Path dist-release/win-unpacked -Filter 'Uninstall*.exe' -File | Select-Object -First 1
          if ($uninstaller) { $signedFiles += $uninstaller.FullName }
          $signedFiles += @(Get-ChildItem -Path dist-release/win-unpacked -Recurse -File -Include *.dll,*.exe | ForEach-Object FullName)
          $signedFiles = @($signedFiles | Sort-Object -Unique)
          foreach ($file in $signedFiles) {
            if (-not (Test-Path $file)) { throw "Signed file is missing: $file" }
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "Authenticode status is $($signature.Status): $file" }
            $signature | Format-List | Out-File -FilePath release-evidence/windows-signature.txt -Append -Encoding utf8
            signtool verify /pa /v $file | Tee-Object -FilePath release-evidence/windows-signtool.txt -Append
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed: $file" }
          }
          node scripts/verify_release_artifact.mjs dist-release/win-unpacked --version 2.0.0 --tag "${{ needs.quality-gate.outputs.release_tag }}" --commit "${{ needs.quality-gate.outputs.source_commit }}" --artifact $installer --manifest release-evidence/windows-manifest.json --platform win32 --arch x64
          Get-ChildItem -Path dist-release -File | Get-FileHash -Algorithm SHA256 | ConvertTo-Json -Depth 3 | Out-File release-evidence/windows-artifacts-sha256.json -Encoding utf8

      - name: Upload Windows release evidence
        uses: actions/upload-artifact@v4
        with:
          name: xedu-client-${{ needs.quality-gate.outputs.release_tag }}-windows
          path: |
            dist-release
            release-evidence
          if-no-files-found: error

  macos-release:
    runs-on: macos-14
    needs: quality-gate
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.quality-gate.outputs.source_commit }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Scratch dependencies
        run: npm ci --prefix scratch-editor

      - name: Provision checkpoint bundle
        env:
          XEDU_CHECKPOINT_BUNDLE_URL: ${{ secrets.XEDU_CHECKPOINT_BUNDLE_URL }}
          XEDU_CHECKPOINT_BUNDLE_SHA256: ${{ secrets.XEDU_CHECKPOINT_BUNDLE_SHA256 }}
        run: node scripts/provision_checkpoint_bundle.mjs

      - name: Check release model assets
        run: node scripts/check_release_inputs.mjs

      - name: Clean release output
        run: rm -rf dist-release release-evidence

      - name: Build signed and notarized macOS release
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run electron:build:release

      - name: Verify packaged contents and write manifest
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          dmg="$(find dist-release -maxdepth 1 -name '*.dmg' -print -quit)"
          zip="$(find dist-release -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$dmg" && test -n "$zip"
          test "$(basename "$dmg")" = 'XEdu Client-2.0.0.dmg'
          test "$(basename "$zip")" = 'XEdu Client-2.0.0.zip'
          node scripts/verify_release_artifact.mjs "dist-release/mac-arm64/XEdu Client.app" --version 2.0.0 --tag "${{ needs.quality-gate.outputs.release_tag }}" --commit "${{ needs.quality-gate.outputs.source_commit }}" --artifact "$dmg" --artifact "$zip" --manifest release-evidence/macos-manifest.json --platform darwin --arch arm64
          codesign --verify --deep --strict --verbose=2 "dist-release/mac-arm64/XEdu Client.app" 2>&1 | tee release-evidence/macos-codesign.txt
          spctl --assess --type execute -vv "dist-release/mac-arm64/XEdu Client.app" 2>&1 | tee release-evidence/macos-spctl.txt
          xcrun stapler validate "$dmg" 2>&1 | tee release-evidence/macos-stapler.txt
          codesign --display --verbose=4 "dist-release/mac-arm64/XEdu Client.app" 2>&1 | tee release-evidence/macos-signing-identity.txt
          find dist-release -maxdepth 1 -type f -print0 | xargs -0 shasum -a 256 > release-evidence/macos-artifacts-sha256.txt

      - name: Upload macOS release evidence
        uses: actions/upload-artifact@v4
        with:
          name: xedu-client-${{ needs.quality-gate.outputs.release_tag }}-macos
          path: |
            dist-release
            release-evidence
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - quality-gate
      - windows-release
      - macos-release
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.quality-gate.outputs.source_commit }}
          fetch-depth: 0

      - name: Download platform release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xedu-client-${{ needs.quality-gate.outputs.release_tag }}-*
          path: release-upload
          merge-multiple: true

      - name: Download dependency audit evidence
        uses: actions/download-artifact@v4
        with:
          name: xedu-client-${{ github.run_id }}-dependency-audit
          path: release-upload/dependency-audit

      - name: Stage public release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          find_one() {
            local name="$1"
            mapfile -t matches < <(find release-upload -type f -name "$name" -not -path '*/win-unpacked/*' | sort)
            if (( ${#matches[@]} != 1 )); then
              printf 'Expected exactly one %s, found %s:\n' "$name" "${#matches[@]}" >&2
              printf ' - %s\n' "${matches[@]}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          cp "$(find_one 'XEdu Client-2.0.0.exe')" 'release-assets/XEdu Client-2.0.0.exe'
          cp "$(find_one 'XEdu Client-2.0.0.dmg')" 'release-assets/XEdu Client-2.0.0.dmg'
          cp "$(find_one 'XEdu Client-2.0.0.zip')" 'release-assets/XEdu Client-2.0.0.zip'
          cp "$(find_one 'windows-manifest.json')" release-assets/windows-manifest.json
          cp "$(find_one 'macos-manifest.json')" release-assets/macos-manifest.json
          cp "$(find_one 'windows-artifacts-sha256.json')" release-assets/windows-artifacts-sha256.json
          cp "$(find_one 'macos-artifacts-sha256.txt')" release-assets/macos-artifacts-sha256.txt
          find release-assets -maxdepth 1 -type f -print | sort

      - name: Create or update draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.quality-gate.outputs.release_tag }}'
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if (( ${#assets[@]} != 7 )); then
            echo "Expected 7 public release assets, found ${#assets[@]}" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            release_args=(--draft --verify-tag --title "XEdu Client $tag" --notes "Draft release for $tag. Formal teacher distribution remains gated by the signed-artifact and classroom acceptance records.")
            if [[ "$tag" == *-rc.* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" "${release_args[@]}" "${assets[@]}"
          fi
