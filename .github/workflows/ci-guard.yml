name: CI Guard

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements_ci.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Backend smoke (health endpoint)
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "backend")
          from api.app import create_app
          app = create_app(Path("tmp_ci_smoke_config"))
          app.testing = True
          client = app.test_client()
          resp = client.get("/api/health")
          assert resp.status_code == 200, resp.get_data(as_text=True)
          data = resp.get_json() or {}
          assert data.get("status") == "ok", data
          PY

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run Blockly runtime tests
        run: npm run test:blockly-runtime

      - name: Bundle size guard
        run: npm run check:bundle
