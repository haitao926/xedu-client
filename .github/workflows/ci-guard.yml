name: CI Guard

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install Scratch dependencies
        run: npm ci --prefix scratch-editor

      - name: Install backend test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements_ci.txt numpy==1.26.4 onnx==1.20.1
          python scripts/seed_xedu_smoke_models.py
          python scripts/seed_xedu_smoke_assets.py

      - name: Run complete quality gate
        run: npm run quality-gate
